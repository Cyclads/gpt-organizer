name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extension
        run: |
          bun install --frozen-lockfile
          bun run compile
          bun run build

      - name: GitHub Pages site
        working-directory: website
        env:
          VITE_SITE_URL: https://example.github.io/gpt-organizer
          VITE_BASE_PATH: /gpt-organizer/
          VITE_GITHUB_REPO: example/gpt-organizer
        run: |
          bun install --frozen-lockfile
          bun run build
