# Deploy marketing site to GitHub Pages (project site: /gpt-organizer/).
#
# One-time: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Also mirrors the built site to the gh-pages branch (legacy / backup hosting).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build site
        working-directory: website
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  gh-pages-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Push static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: GitHub Pages site'
